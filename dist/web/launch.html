<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10080b">
  <title>Radio Client — Launcher</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #f4f5ff; background: radial-gradient(ellipse at top, #501321 0%, #170b10 55%, #090608 100%); }
    main { width: min(100%, 520px); text-align: center; padding: 32px 24px; border: 1px solid #51212c; border-radius: 22px; background: rgba(25, 11, 16, .88); box-shadow: 0 24px 80px #0008; }
    .logo { font-size: clamp(2.4rem, 10vw, 4rem); font-weight: 900; letter-spacing: .08em; margin: 0; background: linear-gradient(100deg, #f3263e, #f2d9ad); color: transparent; background-clip: text; }
    p { color: #c2c5dd; line-height: 1.6; }
    button { margin-top: 16px; width: 100%; border: 0; border-radius: 12px; padding: 16px 20px; font-size: 1rem; font-weight: 800; color: #10080b; background: linear-gradient(100deg, #ff8995, #f2d9ad); cursor: pointer; }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    #status { min-height: 1.5em; font-size: .9rem; }
    .note { font-size: .8rem; color: #969bb9; }
  </style>
</head>
<body>
  <main>
    <p class="logo">RADIO</p>
    <h1>Radio Client</h1>
    <p>Launch the client in a new <code>about:blank</code> tab.</p>
    <button id="launch" type="button">Open in about:blank</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="note">Your browser may block pop-ups. Tap the button again if prompted.</p>
  </main>
  <script>
    document.getElementById("launch").addEventListener("click", function () {
      const blank = window.open("about:blank", "_blank");
      if (!blank) {
        document.getElementById("status").textContent = "Pop-up blocked. Allow pop-ups for this site, then try again.";
        return;
      }
      const clientUrl = new URL("./client/", window.location.href).href;
      try {
        blank.document.open();
        blank.document.write(
          '<!doctype html><html><head><meta charset="utf-8">' +
          '<meta name="viewport" content="width=device-width,initial-scale=1">' +
          '<title>Radio Client</title></head>' +
          '<body style="margin:0;width:100%;height:100%;overflow:hidden;background:#000">' +
          '<iframe title="Radio Client" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write" allowfullscreen ' +
          'style="position:fixed;inset:0;width:100%;height:100%;border:0;background:#000" src="' + clientUrl + '"></iframe>' +
          '</body></html>'
        );
        blank.document.close();
        document.getElementById("status").textContent = "Radio Client opened in a new tab.";
      } catch (error) {
        document.getElementById("status").textContent = "The browser couldn't open the blank tab. Try opening the client normally.";
      }
    });
  </script>
</body>
</html>
