name: Check Eagler 26.2 HTML compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - radio-client
    paths:
      - '.github/workflows/check-radio-engine.yml'
      - 'radio/check_engine_compat.py'
      - 'build.py'

permissions:
  contents: read

jobs:
  inspect-html:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Radio Client branch
        uses: actions/checkout@v4
        with:
          ref: radio-client
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download candidate HTML without committing it
        run: |
          curl --fail --location --retry 2 --output /tmp/eagler-26.2.html \
            https://raw.githubusercontent.com/Alastor-Hartfelt/eaglercraft-26.2/main/index.html
          ls -lh /tmp/eagler-26.2.html
          test "$(wc -c < /tmp/eagler-26.2.html)" -gt 1000000
          sha256sum /tmp/eagler-26.2.html
      - name: Check existing build anchors
        run: python radio/check_engine_compat.py /tmp/eagler-26.2.html
