name: Build and deploy Radio Client to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - radio-client
    paths:
      - '.github/workflows/check-radio-engine.yml'
      - 'radio/check_engine_compat.py'
      - 'radio/check_theme_assets.py'
      - 'build.py'
      - 'gen_textures.py'
      - 'src/**'
      - 'theme/**'
      - 'theme_extra/**'
      - 'epk.py'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  inspect-html:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Radio Client branch
        uses: actions/checkout@v4
        with:
          ref: radio-client
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download candidate HTML without committing it
        run: |
          curl --fail --location --retry 2 --output /tmp/eagler-26.2.html \
            https://raw.githubusercontent.com/Alastor-Hartfelt/eaglercraft-26.2/main/index.html
          ls -lh /tmp/eagler-26.2.html
          test "$(wc -c < /tmp/eagler-26.2.html)" -gt 1000000
          sha256sum /tmp/eagler-26.2.html
      - name: Check existing build anchors
        run: python radio/check_engine_compat.py /tmp/eagler-26.2.html
      - name: Prepare temporary local build input
        run: |
          mkdir -p ref
          cp /tmp/eagler-26.2.html ref/wispcraft-26.2.html
      - name: Install theme-generation dependency
        run: python -m pip install Pillow
      - name: Generate Radio palette textures
        run: python gen_textures.py
      - name: Smoke-check generated Radio theme assets
        run: python radio/check_theme_assets.py
      - name: Run the full Radio Client build
        run: python build.py
      - name: Prepare GitHub Pages site
        run: |
          test -s dist/web/index.html
          test -s dist/web/client/index.html
          test -s dist/web/client/version.txt
          test -d dist/web/client/payload
          # Project Pages live below /radio-client/, so resolve /client/ relative
          # to the deployed homepage instead of the domain root.
          python - <<'PY'
          from pathlib import Path
          path = Path("dist/web/index.html")
          html = path.read_text(encoding="utf-8")
          old = 'const clientPath="/client/";'
          new = 'const clientPath=new URL("client/",window.location.href).pathname;'
          if old not in html:
              raise SystemExit("Could not find launcher clientPath setting")
          path.write_text(html.replace(old, new, 1), encoding="utf-8")
          PY
          touch dist/web/.nojekyll
          echo "Homepage preserved; playable client built under /client/."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
