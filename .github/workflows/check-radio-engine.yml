name: Build and deploy Radio Client to radio-client.github.io

on:
  workflow_dispatch:
  push:
    branches:
      - radio-client
    paths:
      - '.github/workflows/check-radio-engine.yml'
      - 'radio/check_engine_compat.py'
      - 'radio/check_theme_assets.py'
      - 'build.py'
      - 'gen_textures.py'
      - 'src/**'
      - 'theme/**'
      - 'theme_extra/**'
      - 'epk.py'

permissions:
  contents: read

concurrency:
  group: radio-client-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Radio Client branch
        uses: actions/checkout@v4
        with:
          ref: radio-client
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download candidate HTML without committing it
        run: |
          curl --fail --location --retry 2 --output /tmp/eagler-26.2.html \
            https://raw.githubusercontent.com/Alastor-Hartfelt/eaglercraft-26.2/main/index.html
          ls -lh /tmp/eagler-26.2.html
          test "$(wc -c < /tmp/eagler-26.2.html)" -gt 1000000
          sha256sum /tmp/eagler-26.2.html
      - name: Check existing build anchors
        run: python radio/check_engine_compat.py /tmp/eagler-26.2.html
      - name: Prepare temporary local build input
        run: |
          mkdir -p ref
          cp /tmp/eagler-26.2.html ref/wispcraft-26.2.html
      - name: Install theme-generation dependency
        run: python -m pip install Pillow
      - name: Generate Radio palette textures
        run: python gen_textures.py
      - name: Smoke-check generated Radio theme assets
        run: python radio/check_theme_assets.py
      - name: Run the full Radio Client build
        run: python build.py
      - name: Prepare website files
        run: |
          test -s dist/web/index.html
          test -s dist/web/client/index.html
          test -s dist/web/client/version.txt
          test -d dist/web/client/payload
          # The custom domain is served from the root, so /client/ is absolute.
          touch dist/web/.nojekyll
          echo "Homepage preserved; playable client built under /client/."
      - name: Check out the GitHub Pages repository
        uses: actions/checkout@v4
        with:
          repository: radio-client/radio-client.github.io
          ref: main
          token: ${{ secrets.RADIO_CLIENT_PAGES_TOKEN }}
          path: pages-site
      - name: Publish built website
        run: |
          rsync -a --delete --exclude='.git' dist/web/ pages-site/
          cd pages-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No website changes to publish."
            exit 0
          fi
          git add -A
          git commit -m "Deploy Radio Client website"
          git push origin main
